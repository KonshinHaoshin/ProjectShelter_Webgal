name: Deploy WebGAL to COS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to COS
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          cos_bucket: shelter-1386441538
          cos_region: ap-chengdu
          local_path: ./
          remote_path: /webgal/
          clean: true

      - name: Refresh CDN Cache
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.TENCENT_SECRET_KEY }}" \
            -d '{
              "urls": ["https://webgal.shelter.net.cn/webgal/"]
            }' \
            "https://cdn.tencentcloudapi.com/?Action=RefreshCdnUrl&Region=ap-chengdu&Sign=&Nonce=1&Timestamp=&SecretId=${{ secrets.TENCENT_SECRET_ID }}&UrlList.0=https://webgal.shelter.net.cn/webgal/"
