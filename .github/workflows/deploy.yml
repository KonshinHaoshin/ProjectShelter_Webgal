name: Deploy WebGAL to COS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy bundle
        run: |
          mkdir -p .deploy
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude '.deploy/' \
            --exclude 'webgal_resource_analyzer/' \
            ./ .deploy/

      - name: Upload to COS
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          cos_bucket: shelter-1386441538
          cos_region: ap-chengdu
          local_path: .deploy
          remote_path: /webgal/
          clean: true

      - name: Refresh CDN Cache
        uses: TencentCloud/cdn-refresh-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          urls: |
            https://webgal.shelter.net.cn/webgal/
